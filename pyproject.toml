[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kappa-box"
version = "0.1.0"
description = "Evidence-first sandbox infrastructure for evaluation runs"
requires-python = ">=3.12"
dependencies = [
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
test = [
  "jsonschema>=4.23,<5",
  "pytest>=9,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.pyright]
extraPaths = ["src"]
